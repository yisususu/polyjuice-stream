# Run: ./bin/polyjuice-stream serve --config examples/configs/multi-model.yaml
# Dataset paths resolve from this file's directory.
listen: "127.0.0.1:9900"
write_timeout: 10s

models:
  random-model:
    source: random
    seed: 42
    chunks: 10
    chunk_chars: 4
    first_delay: 100ms
    interval: 10ms

  replay-model:
    source: jsonl
    path: ../datasets/responses.jsonl
    text_field: result
    chunk_chars: 3
    first_delay: 100ms
    interval: 30ms
